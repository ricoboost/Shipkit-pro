# ============================================
# ShipKit Docker Compose - Development
# Use: docker-compose -f docker-compose.dev.yml up
# ============================================

services:
  # ==========================================
  # PostgreSQL Database (Development)
  # ==========================================
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shipkit
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - shipkit-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis (Development)
  # ==========================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - shipkit-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Mailhog (Email Testing)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    restart: unless-stopped
    networks:
      - shipkit-dev

  # ==========================================
  # Adminer (Database Admin UI)
  # ==========================================
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shipkit-dev
    environment:
      - ADMINER_DEFAULT_SERVER=db

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  shipkit-dev:
    driver: bridge
